# Local Postgres for dev and tests. Port 5433 so it doesn't fight a native Postgres on 5432.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: plenty
      POSTGRES_PASSWORD: plenty
      POSTGRES_DB: plenty
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP + plenty_test: the init-time server is socket-only and the test db comes last
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U plenty -d plenty_test"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
