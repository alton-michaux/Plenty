# Local Postgres for dev and tests. Port 5433 so it doesn't fight a native Postgres on 5432.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: plenty
      POSTGRES_PASSWORD: plenty
      POSTGRES_DB: plenty
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plenty"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
