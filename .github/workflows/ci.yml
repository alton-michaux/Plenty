name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: plenty
          POSTGRES_PASSWORD: plenty
          POSTGRES_DB: plenty
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U plenty" --health-interval 2s --health-retries 15
    env:
      PLENTY_DATABASE_URL: postgresql+psycopg://plenty:plenty@localhost:5433/plenty
      PLENTY_TEST_DATABASE_URL: postgresql+psycopg://plenty:plenty@localhost:5433/plenty
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      # Migrations apply cleanly and match the models
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t plenty .
